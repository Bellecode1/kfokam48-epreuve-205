openapi: 3.0.3
info:
  title: Contrat d'API — KFOKAM48 Présence & Relecture
  version: "1.0"
  description: |
    Les cinq opérations imposées par le sujet sont respectées à la lettre :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    Les opérations supplémentaires couvrent les besoins du cahier des charges.

servers:
  - url: http://localhost:8080

paths:

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }
        "410": { $ref: "#/components/responses/Erreur" }
        "429": { $ref: "#/components/responses/Erreur" }

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [DEPOSE, EN_ATTENTE_RELECTURE, RELU] }
        "400": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }
        "410": { $ref: "#/components/responses/Erreur" }

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }

  /api/promotions:
    get:
      summary: Liste des promotions (RG1)
      responses:
        "200":
          description: Liste des promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
                    annee: { type: string, nullable: true }

  /api/promotions/{id}/etudiants:
    get:
      summary: Liste des étudiants d'une promotion (RG1)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des étudiants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom, prenom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
                    prenom: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }

  /api/sessions/{id}:
    get:
      summary: Consulter une session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Détail d'une session
          content:
            application/json:
              schema:
                type: object
                required: [id, titre, code, ouvertureAt, expirationAt, cloturee]
                properties:
                  id: { type: integer, format: int64 }
                  titre: { type: string }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
                  clotureAt: { type: string, format: date-time, nullable: true }
                  cloturee: { type: boolean }
                  promotionId: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/Erreur" }

  /api/sessions/{id}/presences:
    get:
      summary: Présences d'une session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des présences
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, etudiantId, source, marqueeAt]
                  properties:
                    id: { type: integer, format: int64 }
                    etudiantId: { type: integer, format: int64 }
                    source: { type: string, enum: [ETUDIANT, FORMATEUR] }
                    marqueeAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }

  /api/sessions/{id}/cloturer:
    post:
      summary: Le formateur clôture une session (EF12)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Session clôturée }
        "404": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }

  /api/presences/manuelle:
    post:
      summary: Le formateur ajoute une présence manuellement (EF3, RG14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée avec source = FORMATEUR
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }
        "410": { $ref: "#/components/responses/Erreur" }

  /api/exercices/{id}:
    put:
      summary: L'étudiant remplace le lien de son exercice (EF5, RG13)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema:
                type: object
                required: [id, lien, statut]
                properties:
                  id: { type: integer, format: int64 }
                  lien: { type: string, format: uri }
                  statut: { type: string, enum: [DEPOSE, EN_ATTENTE_RELECTURE, RELU] }
        "400": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }
    get:
      summary: Consulter un exercice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Détail d'un exercice
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, lien, statut]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  lien: { type: string, format: uri }
                  statut: { type: string, enum: [DEPOSE, EN_ATTENTE_RELECTURE, RELU] }
                  deposeAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }

  /api/relectures/{id}:
    get:
      summary: Le relecteur consulte la relecture assignée (EF7)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Détail d'une relecture
          content:
            application/json:
              schema:
                type: object
                required: [id, exerciceId, statut]
                properties:
                  id: { type: integer, format: int64 }
                  exerciceId: { type: integer, format: int64 }
                  lien: { type: string, format: uri }
                  auteurNom: { type: string }
                  note: { type: integer, nullable: true }
                  commentaire: { type: string, nullable: true }
                  statut: { type: string, enum: [ASSIGNEE, RENDUE] }
        "404": { $ref: "#/components/responses/Erreur" }

  /api/etudiants/{id}/relectures:
    get:
      summary: Relectures assignées à un étudiant (EF7, EF13)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des relectures assignées
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, exerciceId, statut]
                  properties:
                    id: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    statut: { type: string, enum: [ASSIGNEE, RENDUE] }

  /api/relectures/{id}/reassigner:
    post:
      summary: Le formateur réassigne une relecture en souffrance (EF13, RG16)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nouveauRelecteurId]
              properties:
                nouveauRelecteurId: { type: integer, format: int64 }
      responses:
        "200": { description: Relecture réassignée }
        "400": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }

  /api/etudiants/{id}/notes:
    get:
      summary: Notes et commentaires reçus par un étudiant (EF10, RG8)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Notes reçues (sans le nom du relecteur)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [exerciceId, note, commentaire]
                  properties:
                    exerciceId: { type: integer, format: int64 }
                    note: { type: integer, nullable: true }
                    commentaire: { type: string, nullable: true }

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.